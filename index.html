<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karta Kurier</title>
<style>
body { font-family: Arial; margin: 10px; }
input, button { font-size: 18px; padding: 10px; margin: 5px 0; width: 100%; }
.street { padding: 8px; border-bottom: 1px solid #ddd; cursor: pointer; }
.box { margin-top: 10px; padding: 10px; border: 1px solid #ccc; }
.small { font-size: 14px; color: gray; }
</style>
</head>
<body>

<h2>📦 Курьер приложение</h2>

<input id="search" placeholder="Улица (например: obo, gor...)" oninput="searchStreet()">
<div id="streetList"></div>

<div class="box">
<input id="house" placeholder="Дом (например 74)">
<input id="flat" placeholder="Квартира (необязательно)">
<button onclick="addAddress()">Добавить</button>
</div>

<button onclick="makeRoute()">🚀 Построить маршрут</button>
<button onclick="clearAll()">🗑 Очистить</button>

<h3>Список</h3>
<div id="list"></div>

<script>
const streets = {
  // 3 КРАТА (первые в маршруте)
  "obozowa": {basket:3, even:[58,114], odd:null},
  "majakowskiego": {basket:3},
  "prymasa 3": {basket:3, fixed:[151,153,155]},
  "szalka": {basket:3},
  "przy lasku": {basket:3},
  "bolecha": {basket:3},
  "dobrogniewa": {basket:3},

  // 2 КРАТА
  "górczewska": {basket:2, fixed:[56,60,80,82,84]},
  "bielskiego": {basket:2},
  "ciołka": {basket:2},
  "deotymy": {basket:2, list:[7,9,11,13,15,17,19,21,25,33,37,41,43,43.1,45,46,48,49,51,52,54,56,58]},
  "sitnika": {basket:2},
  "raszei": {basket:2},
  "brożka": {basket:2},

  // 1 КРАТА (последние)
  "obozowa odd": {basket:1, odd:[61,91]},
  "magistracka": {basket:1},
  "dobiszewskiego": {basket:1, fixed:[1,2,3,5]},
  "prymasa 1": {basket:1, fixed:[137,145,149]},
  "czorsztyńska": {basket:1},
  "ożarowska": {basket:1}
};

let data = JSON.parse(localStorage.getItem("data") || "[]");

function searchStreet(){
  const val = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("streetList");
  list.innerHTML = "";

  for(let s in streets){
    if(s.includes(val)){
      let div = document.createElement("div");
      div.className = "street";
      div.innerText = s;
      div.onclick = () => {
        document.getElementById("search").value = s;
      };
      list.appendChild(div);
    }
  }
}

function getBasket(street, house){
  let r = streets[street];
  if(!r) return 3;

  if(r.fixed && r.fixed.includes(Number(house))) return r.basket;
  if(r.list && r.list.includes(Number(house))) return r.basket;
  if(r.even){
    if(house % 2 === 0 && house >= r.even[0] && house <= r.even[1]) return r.basket;
  }
  if(r.odd){
    if(house % 2 === 1 && house >= r.odd[0] && house <= r.odd[1]) return r.basket;
  }
  return r.basket;
}

function addAddress(){
  let street = document.getElementById("search").value.toLowerCase();
  let house = document.getElementById("house").value;
  let flat = document.getElementById("flat").value;

  if(!street || !house) return;

  let basket = getBasket(street, Number(house));

  data.push({street, house, flat, basket});
  localStorage.setItem("data", JSON.stringify(data));

  document.getElementById("house").value = "";
  document.getElementById("flat").value = "";

  render();
}

function render(){
  let el = document.getElementById("list");
  el.innerHTML = "";

  data.forEach((d,i)=>{
    el.innerHTML += `<div>${i+1}. ${d.street} ${d.house}/${d.flat||""} — 🟡 ${d.basket}</div>`;
  });
}

function makeRoute(){
  let sorted = [...data].sort((a,b)=>b.basket-a.basket);
  data = sorted;
  localStorage.setItem("data", JSON.stringify(data));
  render();
}

function clearAll(){
  data = [];
  localStorage.removeItem("data");
  render();
}

render();
</script>

</body>
</html>
