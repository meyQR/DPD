<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karta Kurier</title>
<style>
body {
  font-family: Arial;
  margin: 10px;
  background: #2f2f2f;
  color: #fff;
}

.header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 25px;
  padding-bottom: 25px;
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.header-right h2 {
  margin: 0;
}

.header img {
  width: 90px;
  height: auto;
}

input {
  font-size: 18px;
  padding: 10px;
  margin: 5px 0;
  width: 100%;
  box-sizing: border-box;
  border-radius: 6px;
  border: none;
}

.button-wrap {
  display: flex;
  justify-content: center;
}

button {
  font-size: 16px;
  padding: 10px;
  margin: 5px 0;
  width: 60%;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.btn-green {
  background: #1f8f3a;
  color: white;
}

.btn-gray {
  background: #999;
  color: white;
}

.box {
  margin-top: 10px;
  padding: 10px;
  border: 0px solid #888;
  background: rgba(255,255,255,0.10);
}

.street {
  padding: 8px;
  border-bottom: 1px solid #666;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
}

#streetList {
  max-height: 250px;
  overflow-y: auto;
}

/* Route links block */
#routeLinks {
  margin-top: 14px;
}

.route-pack {
  display: block;
  margin: 8px 0;
  padding: 10px 14px;
  background: #1a5c2e;
  border-radius: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
}

.route-pack:hover {
  background: #25803f;
}

.route-pack-label {
  font-size: 12px;
  color: #a0f0b8;
  display: block;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<div class="header">
  <img src="DPD_im.PNG" alt="DPD">
</div>
  
<div class="box">
<input id="search" placeholder="Улица" oninput="searchStreet()">
<div id="streetList"></div>

<input id="house" placeholder="Дом">
<input id="flat" placeholder="Квартира (необязательно)">

<div class="button-wrap">
  <button class="btn-gray" onclick="addAddress()">Добавить</button>
</div>

<div class="button-wrap">
  <button class="btn-green" onclick="makeRoute()">Построить маршрут</button>
</div>
<div class="button-wrap">
  <button class="btn-gray" onclick="clearAll()">Очистить</button>
</div>
  
<h3>Список</h3>
<div id="list"></div>
<div id="routeLinks"></div>

<script>
const streets = {
  "obozowa": { mapName:"Obozowa", aliases:["obozowa"], basket:3, even:[58,114] },
  "majakowskiego": { mapName:"Majakowskiego", aliases:["majakowskiego"], basket:3 },

  "prymasa tysiąclecia": {
    mapName: "Aleja Prymasa Tysiąclecia",
    aliases: ["prymasa", "prymasa tysiąclecia", "prymasa tysiaclecia"],
    basket: 3,
    fixed: [151,153,155,137,145,149]
  },
  
  "szalka": { mapName:"Szałka", aliases:["szalka","szalka"], basket:3 },
  "przy lasku": { mapName:"Przy Lasku", aliases:["przy lasku","przylasku"], basket:3 },
  "bolecha": { mapName:"Bolecha", aliases:["bolecha"], basket:3 },
  "dobrogniewa": { mapName:"Dobrogniewa", aliases:["dobrogniewa"], basket:3 },

  "górczewska": {
    mapName:"Górczewska",
    aliases:["gorczewska","górczewska"],
    basket:2,
    fixed:[56,60,80,82,84]
  },

  "bielskiego": { mapName:"Bielskiego", aliases:["bielskiego"], basket:2 },
  "ciołka": { mapName:"Ciołka", aliases:["ciolka","ciołka"], basket:2 },

  "deotymy": {
    mapName:"Deotymy",
    aliases:["deotymy"],
    basket:2,
    list:[7,9,11,13,15,17,19,21,25,33,37,41,43,45,46,48,49,51,52,54,56,58]
  },

  "sitnik": { mapName:"Sitnik", aliases:["sitnik","sitnika"], basket:2 },
  "raszei": { mapName:"Raszei", aliases:["raszei"], basket:2 },

  "brożka": { mapName:"Brożka", aliases:["brozka","brożka"], basket:2 },

  "obozowa odd": { mapName:"Obozowa", aliases:["obozowa"], basket:1, odd:[61,91] },
  "magistracka": { mapName:"Magistracka", aliases:["magistracka"], basket:1 },

  "dobiszewskiego": {
    mapName:"Dobiszewskiego",
    aliases:["dobiszewskiego"],
    basket:1,
    fixed:[1,2,3,5]
  },

  "czorsztyńska": {
    mapName:"Czorsztyńska",
    aliases:["czorsztynska","czorsztyńska"],
    basket:1
  },

  "ożarowska": {
    mapName:"Ożarowska",
    aliases:["ozarowska","ożarowska"],
    basket:1
  }
};

let data = JSON.parse(localStorage.getItem("data") || "[]");

function normalize(str){
  return str.toLowerCase()
    .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e")
    .replace(/ł/g,"l").replace(/ń/g,"n").replace(/ó/g,"o")
    .replace(/ś/g,"s").replace(/ż/g,"z").replace(/ź/g,"z");
}

function searchStreet(){
  const val = normalize(document.getElementById("search").value);
  const list = document.getElementById("streetList");
  list.innerHTML = "";

  for (const key in streets){
    const s = streets[key];
    const found =
      normalize(key).includes(val) ||
      (s.aliases || []).some(a => normalize(a).includes(val));

    if(found){
      const div = document.createElement("div");
      div.className = "street";
      div.innerText = key;
      div.onclick = () => {
        document.getElementById("search").value = key;
        list.innerHTML = "";
      };
      list.appendChild(div);
    }
  }
}

function getBasket(street, house){
  const r = streets[street];
  if(!r) return 3;

  const h = Number(house);

  if(r.basketMap){
    for(const b in r.basketMap){
      if(r.basketMap[b].includes(h)) return Number(b);
    }
  }

  return r.basket;
}

function addAddress(){
  const street = document.getElementById("search").value.toLowerCase().trim();
  const house = document.getElementById("house").value.trim();
  const flat = document.getElementById("flat").value.trim();

  if(!street || !house) return;

  data.push({
    street,
    house,
    flat,
    basket: getBasket(street, Number(house))
  });

  localStorage.setItem("data", JSON.stringify(data));

  document.getElementById("search").value = "";
  document.getElementById("house").value = "";
  document.getElementById("flat").value = "";

  render();
}

function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  data.forEach((d,i)=>{
    let color='';
    let text='';
    if(d.basket===1){color='green';text='1 крата';}
    if(d.basket===2){color='orange';text='2 крата';}
    if(d.basket===3){color='red';text='3 крата';}
    el.innerHTML += `<div>${i+1}. ${d.street} ${d.house} ${d.flat ? "/" + d.flat : ""} — <span style="color:${color}">${text}</span></div>`;
  });

  // clear route links when list changes
  document.getElementById("routeLinks").innerHTML = "";
}

function buildGoogleMapsUrl(addresses) {
  if (addresses.length === 0) return null;
  if (addresses.length === 1) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addresses[0])}`;
  }
  const origin = encodeURIComponent(addresses[0]);
  const destination = encodeURIComponent(addresses[addresses.length - 1]);
  let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
  if (addresses.length > 2) {
    url += "&waypoints=" + addresses.slice(1, -1).map(encodeURIComponent).join("|");
  }
  return url;
}

function makeRoute(){
  if(data.length < 1){
    alert("Добавь минимум 1 адрес");
    return;
  }

  // Sort all addresses: basket 3 first, then 2, then 1
  const sorted = [...data].sort((a, b) => b.basket - a.basket);

  // Convert to map address strings
  const allAddresses = sorted.map(item => ({
    label: `${item.street} ${item.house}${item.flat ? "/" + item.flat : ""}`,
    mapAddr: `${streets[item.street]?.mapName || item.street} ${item.house}, Warszawa, Poland`,
    basket: item.basket
  }));

  // Split into chunks of max 10
  const chunks = [];
  let i = 0;
  while (i < allAddresses.length) {
    chunks.push(allAddresses.slice(i, i + 10));
    i += 10;
  }

  // Render route links
  const routeLinksEl = document.getElementById("routeLinks");
  routeLinksEl.innerHTML = "<h3>Маршруты</h3>";

  const basketLabel = { 3: "3 крата", 2: "2 крата", 1: "1 крата" };
  const basketColor = { 3: "#e05050", 2: "#e09030", 1: "#50b060" };

  chunks.forEach((chunk, idx) => {
    const url = buildGoogleMapsUrl(chunk.map(a => a.mapAddr));
    const firstBasket = chunk[0].basket;
    const lastBasket = chunk[chunk.length - 1].basket;

    // Build label for basket range
    let rangeLabel = basketLabel[firstBasket];
    if (lastBasket !== firstBasket) {
      rangeLabel += " → " + basketLabel[lastBasket];
    }

    // Build short address list
    const addrList = chunk.map(a => a.label).join(", ");

    const a = document.createElement("a");
    a.className = "route-pack";
    a.href = url;
    a.target = "_blank";
    a.innerHTML = `
      <span class="route-pack-label">Пак ${idx + 1} · ${chunk.length} точек · ${rangeLabel}</span>
      ${addrList}
    `;
    routeLinksEl.appendChild(a);
  });
}

function clearAll(){
  data = [];
  localStorage.removeItem("data");
  render();
  document.getElementById("routeLinks").innerHTML = "";
}

render();

document.addEventListener("click", function(e){
  const search = document.getElementById("search");
  const list = document.getElementById("streetList");

  if(e.target !== search){
    list.innerHTML = "";
  }
});  
  
</script>

</body>
</html>
