<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karta Kurier</title>
<style>
body {
  font-family: Arial;
  margin: 10px;
  background: #222;
  color: #fff;
}

.header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 25px;
  padding-bottom: 25px;
}

.header img {
  width: 125px;
  height: auto;
}

input {
  font-size: 16px;
  padding: 10px;
  margin: 5px 0;
  width: 100%;
  box-sizing: border-box;
  border-radius: 6px;
  border: none;
}

input.error {
  border: 2px solid #e05050;
  background: #3a2020;
  color: #ffaaaa;
}

.error-msg {
  color: #ff7070;
  font-size: 13px;
  margin: 2px 0 4px 2px;
  display: none;
}
.error-msg.visible {
  display: block;
}

.button-row {
  display: flex;
  gap: 8px;
  margin: 5px 0;
}

.button-row button {
  flex: 1;
}

.button-wrap {
  display: flex;
  justify-content: center;
}

button {
  font-size: 16px;
  padding: 10px;
  margin: 5px 0;
  width: 60%;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.btn-green {
  background: #1f8f3a;
  color: white;
}

.btn-gray {
  background: #999;
  color: white;
}

.box {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  background: rgba(255,255,255,0.10);
}

.street {
  padding: 8px;
  border-bottom: 1px solid #666;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
}

#streetList {
  max-height: 250px;
  overflow-y: auto;
}

#routeLinks {
  margin-top: 14px;
}

.route-pack {
  display: block;
  margin: 8px 0;
  padding: 10px 14px;
  background: #1a5c2e;
  border-radius: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
}

.route-pack:hover {
  background: #25803f;
}

.route-pack-label {
  font-size: 12px;
  color: #a0f0b8;
  display: block;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.hint {
  font-size: 12px;
  color: #aaa;
  margin: 2px 0 4px 2px;
}
</style>
</head>
<body>

<div class="header">
  <img src="DPD_im.PNG" alt="DPD">
</div>

<div class="box">
  <input id="search" placeholder="Улица" oninput="searchStreet()" autocomplete="off">
  <div id="streetList"></div>

  <input id="house" placeholder="Дом" oninput="validateHouse()">
  <div class="error-msg" id="houseError">Неверный номер дома</div>
  <div class="hint" id="houseHint"></div>

  <input id="flat" placeholder="Квартира (необязательно)">

  <div class="button-row">
    <button class="btn-gray" onclick="addAddress()">Добавить</button>
    <button class="btn-gray" onclick="clearAll()">Очистить</button>
  </div>
  <div class="button-wrap">
    <button class="btn-green" onclick="makeRoute()">Построить маршрут</button>
  </div>

  <h3></h3>
  <div id="list"></div>
  <div id="routeLinks"></div>
</div>

<script>
const streetDefs = [
  // ── КРАТА 1 ──────────────────────────────────────────────
  {
    key: "obozowa",
    mapName: "Obozowa",
    aliases: ["obozowa"],
    basket: 1,
    basketSortOrder: 1,
    hintText: "Нечётные: 61–91",
    validate(n) {
      return (n % 2 !== 0 && n >= 61 && n <= 91) ? 1 : null;
    }
  },
  {
    key: "magistracka",
    mapName: "Magistracka",
    aliases: ["magistracka"],
    basket: 1,
    basketSortOrder: 2,
    hintText: "27–61",
    validate(n) {
      return (n >= 27 && n <= 61) ? 1 : null;
    }
  },
  {
    key: "dobiszewskiego",
    mapName: "Dobiszewskiego",
    aliases: ["dobiszewskiego"],
    basket: 1,
    basketSortOrder: 3,
    hintText: "1, 2, 3, 5",
    validate(n) {
      return [1, 2, 3, 5].includes(n) ? 1 : null;
    }
  },
  {
    key: "prymasa tysiąclecia 1",
    mapName: "Aleja Prymasa Tysiąclecia",
    aliases: ["prymasa", "prymasa tysiąclecia", "prymasa tysiaclecia"],
    basket: 1,
    basketSortOrder: 4,
    hintText: "137, 145, 149 (крата 1) или 151, 153, 155 (крата 3)",
    validate(n) {
      if ([137, 145, 149].includes(n)) return 1;
      if ([151, 153, 155].includes(n)) return 3;
      return null;
    }
  },
  {
    key: "czorsztyńska",
    mapName: "Czorsztyńska",
    aliases: ["czorsztynska", "czorsztyńska"],
    basket: 1,
    basketSortOrder: 5,
    hintText: "2–6",
    validate(n) {
      return (n >= 2 && n <= 6) ? 1 : null;
    }
  },
  {
    key: "ożarowska",
    mapName: "Ożarowska",
    aliases: ["ozarowska", "ożarowska"],
    basket: 1,
    basketSortOrder: 6,
    hintText: "59–77",
    validate(n) {
      return (n >= 59 && n <= 77) ? 1 : null;
    }
  },

  // ── КРАТА 2 ──────────────────────────────────────────────
  {
    key: "górczewska",
    mapName: "Górczewska",
    aliases: ["gorczewska", "górczewska"],
    basket: 2,
    basketSortOrder: 1,
    hintText: "56/60, 80, 82, 82/84",
    validateRaw(raw) {
      const valid = ["56/60","80","82","82/84"];
      const norm = raw.trim().replace(/\s/g,"");
      if (valid.includes(norm)) return 2;
      return null;
    },
    validate(n) {
      return [56, 60, 80, 82, 84].includes(n) ? 2 : null;
    }
  },
  {
    key: "bielskiego",
    mapName: "Bielskiego",
    aliases: ["bielskiego"],
    basket: 2,
    basketSortOrder: 2,
    hintText: "2–8",
    validate(n) {
      return (n >= 2 && n <= 8) ? 2 : null;
    }
  },
  {
    key: "ciołka",
    mapName: "Ciołka",
    aliases: ["ciolka", "ciołka"],
    basket: 2,
    basketSortOrder: 3,
    hintText: "2–6",
    validate(n) {
      return (n >= 2 && n <= 6) ? 2 : null;
    }
  },
  {
    key: "deotymy",
    mapName: "Deotymy",
    aliases: ["deotymy"],
    basket: 2,
    basketSortOrder: 4,
    hintText: "7/9, 11, 13, 15, 17, 19, 21, 25, 33, 37, 41, 43, 45, 46, 48, 49, 51, 52, 54, 56, 58",
    validateRaw(raw) {
      const valid = ["7/9","11","13","15","17","19","21","25","33","37","41","43","45","46","48","49","51","52","54","56","58"];
      const norm = raw.trim().replace(/\s/g,"");
      if (valid.includes(norm)) return 2;
      return null;
    },
    validate(n) {
      return [7,9,11,13,15,17,19,21,25,33,37,41,43,45,46,48,49,51,52,54,56,58].includes(n) ? 2 : null;
    }
  },
  {
    key: "sitnika",
    mapName: "Sitnika",
    aliases: ["sitnika", "sitnika"],
    basket: 2,
    basketSortOrder: 5,
    hintText: "1–6",
    validate(n) {
      return (n >= 1 && n <= 6) ? 2 : null;
    }
  },
  {
    key: "raszei",
    mapName: "Raszei",
    aliases: ["raszei"],
    basket: 2,
    basketSortOrder: 6,
    hintText: "2–8",
    validate(n) {
      return (n >= 2 && n <= 8) ? 2 : null;
    }
  },
  {
    key: "brożka",
    mapName: "Brożka",
    aliases: ["brozka", "brożka"],
    basket: 2,
    basketSortOrder: 7,
    hintText: "1–2",
    validate(n) {
      return (n >= 1 && n <= 2) ? 2 : null;
    }
  },
  {
    key: "ringelbluma",
    mapName: "Ringelbluma",
    aliases: ["ringelbluma"],
    basket: 2,
    basketSortOrder: 8,
    hintText: "1, 2, 3",
    validate(n) {
      return [1, 2, 3].includes(n) ? 2 : null;
    }
  },
  // ── КРАТА 3 ──────────────────────────────────────────────
  {
    key: "obozowa 3",
    mapName: "Obozowa",
    aliases: ["obozowa"],
    basket: 3,
    basketSortOrder: 1,
    hintText: "Чётные: 58–114",
    validate(n) {
      return (n % 2 === 0 && n >= 58 && n <= 114) ? 3 : null;
    }
  },
  {
    key: "majakowskiego",
    mapName: "Majakowskiego",
    aliases: ["majakowskiego"],
    basket: 3,
    basketSortOrder: 2,
    hintText: "2–8",
    validate(n) {
      return (n >= 2 && n <= 8) ? 3 : null;
    }
  },
  {
    key: "szałka",
    mapName: "Szałka",
    aliases: ["szalka", "szałka"],
    basket: 3,
    basketSortOrder: 4,
    hintText: "4, 6",
    validate(n) {
      return [4, 6].includes(n) ? 3 : null;
    }
  },
  {
    key: "przy lasku",
    mapName: "Przy Lasku",
    aliases: ["przy lasku", "przylasku"],
    basket: 3,
    basketSortOrder: 5,
    hintText: "1–8",
    validate(n) {
      return (n >= 1 && n <= 8) ? 3 : null;
    }
  },
  {
    key: "bolecha",
    mapName: "Bolecha",
    aliases: ["bolecha"],
    basket: 3,
    basketSortOrder: 6,
    hintText: "1–99",
    validate(n) {
      return (n >= 1 && n <= 99) ? 3 : null;
    }
  },
  {
    key: "dobrogniewa",
    mapName: "Dobrogniewa",
    aliases: ["dobrogniewa"],
    basket: 3,
    basketSortOrder: 7,
    hintText: "1–30",
    validate(n) {
      return (n >= 1 && n <= 30) ? 3 : null;
    }
  },
];

function normalize(str) {
  return str.toLowerCase()
    .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e")
    .replace(/ł/g,"l").replace(/ń/g,"n").replace(/ó/g,"o")
    .replace(/ś/g,"s").replace(/ż/g,"z").replace(/ź/g,"z");
}

let data = JSON.parse(localStorage.getItem("data") || "[]");

function searchStreet() {
  const val = normalize(document.getElementById("search").value);
  const listEl = document.getElementById("streetList");
  listEl.innerHTML = "";
  document.getElementById("houseHint").textContent = "";

  if (!val) return;

  const shown = new Set();
  for (const def of streetDefs) {
    if (def.aliases.some(a => normalize(a).includes(val))) {
      if (!shown.has(def.mapName)) {
        shown.add(def.mapName);
        const div = document.createElement("div");
        div.className = "street";
        div.innerText = def.mapName;
        div.onclick = () => {
          document.getElementById("search").value = def.mapName;
          listEl.innerHTML = "";
          showHint(def.mapName);
        };
        listEl.appendChild(div);
      }
    }
  }
}

function showHint(mapName) {
  const defs = streetDefs.filter(d => d.mapName === mapName);
  const hints = [...new Set(defs.map(d => d.hintText).filter(Boolean))];
  document.getElementById("houseHint").textContent = hints.join(" / ");
}

function getDefsForInput() {
  const inputName = normalize(document.getElementById("search").value.trim());
  return streetDefs.filter(d =>
    d.aliases.some(a => normalize(a) === inputName) ||
    normalize(d.mapName) === inputName
  );
}

function parseHouseNum(raw) {
  const norm = raw.trim();
  if (/^\d+$/.test(norm)) return Number(norm);
  if (/^\d+\/\d+$/.test(norm)) return Number(norm.split("/")[0]);
  return NaN;
}

function validateHouse() {
  const houseVal = document.getElementById("house").value.trim();
  const errorEl = document.getElementById("houseError");
  const houseInput = document.getElementById("house");

  if (!houseVal) {
    houseInput.classList.remove("error");
    errorEl.classList.remove("visible");
    return true;
  }

  const defs = getDefsForInput();
  if (defs.length === 0) return true;

  const resultRaw = defs.reduce((found, def) => {
    if (found !== null) return found;
    if (def.validateRaw) return def.validateRaw(houseVal) ?? null;
    return null;
  }, null);

  if (resultRaw !== null) {
    houseInput.classList.remove("error");
    errorEl.classList.remove("visible");
    return true;
  }

  const n = parseHouseNum(houseVal);
  if (isNaN(n) || n <= 0) {
    houseInput.classList.add("error");
    errorEl.textContent = "Неверный номер дома";
    errorEl.classList.add("visible");
    return false;
  }

  const result = defs.reduce((found, def) => found ?? def.validate(n), null);

  if (result === null) {
    houseInput.classList.add("error");
    errorEl.textContent = "Неверный номер дома";
    errorEl.classList.add("visible");
    return false;
  }

  houseInput.classList.remove("error");
  errorEl.classList.remove("visible");
  return true;
}

function addAddress() {
  const searchVal = document.getElementById("search").value.trim();
  const houseVal = document.getElementById("house").value.trim();
  const flatVal = document.getElementById("flat").value.trim();

  if (!searchVal || !houseVal) return;
  if (!validateHouse()) return;

  const defs = getDefsForInput();
  if (defs.length === 0) { alert("Улица не найдена"); return; }

  let basket = null;
  let matchedDef = null;

  for (const def of defs) {
    if (def.validateRaw) {
      const b = def.validateRaw(houseVal);
      if (b !== null) { basket = b; matchedDef = def; break; }
    }
  }
  if (basket === null) {
    const n = parseHouseNum(houseVal);
    for (const def of defs) {
      const b = def.validate(n);
      if (b !== null) { basket = b; matchedDef = def; break; }
    }
  }

  if (basket === null) return;

  data.push({
    streetInput: searchVal,
    house: houseVal,
    flat: flatVal,
    basket,
    mapName: matchedDef.mapName,
    basketSortOrder: matchedDef.basketSortOrder
  });

  localStorage.setItem("data", JSON.stringify(data));

  document.getElementById("search").value = "";
  document.getElementById("house").value = "";
  document.getElementById("flat").value = "";
  document.getElementById("houseHint").textContent = "";
  document.getElementById("houseError").classList.remove("visible");
  document.getElementById("house").classList.remove("error");

  render();
}

function render() {
  const el = document.getElementById("list");
  el.innerHTML = "";

  data.forEach((d, i) => {
    let color = '', text = '';
    if (d.basket === 1) { color = 'green';  text = '1 крата'; }
    if (d.basket === 2) { color = 'orange'; text = '2 крата'; }
    if (d.basket === 3) { color = 'red';    text = '3 крата'; }
    const flatPart = d.flat ? ` кв ${d.flat}` : "";
    el.innerHTML += `<div style="margin:4px 0">${i+1}. ${d.streetInput} ${d.house}${flatPart} — <span style="color:${color}">${text}</span></div>`;
  });

  document.getElementById("routeLinks").innerHTML = "";
}

function buildGoogleMapsUrl(addrs) {
  const parts = addrs.map(a => encodeURIComponent(a));
  return "https://maps.google.com/maps/dir/" + parts.join("/");
}

function makeRoute() {
  if (data.length < 1) { alert("Добавь минимум 1 адрес"); return; }

  const sorted = [...data].sort((a, b) => {
    if (b.basket !== a.basket) return b.basket - a.basket;
    if (a.basketSortOrder !== b.basketSortOrder) return a.basketSortOrder - b.basketSortOrder;
    return parseHouseNum(a.house) - parseHouseNum(b.house);
  });

  const allAddresses = sorted.map(item => ({
    label: `${item.streetInput} ${item.house}${item.flat ? ` кв ${item.flat}` : ""}`,
    mapAddr: `${item.mapName} ${parseHouseNum(item.house)} Warszawa`,
    basket: item.basket
  }));

  const chunks = [];
  let i = 0;
  while (i < allAddresses.length) { chunks.push(allAddresses.slice(i, i + 10)); i += 10; }

  const routeLinksEl = document.getElementById("routeLinks");
  routeLinksEl.innerHTML = "<h3>Маршруты</h3>";

  const basketLabel = { 3: "3 крата", 2: "2 крата", 1: "1 крата" };

  chunks.forEach((chunk, idx) => {
    const url = buildGoogleMapsUrl(chunk.map(a => a.mapAddr));
    const firstBasket = chunk[0].basket;
    const lastBasket = chunk[chunk.length - 1].basket;
    let rangeLabel = basketLabel[firstBasket];
    if (lastBasket !== firstBasket) rangeLabel += " → " + basketLabel[lastBasket];

    const addrList = chunk.map((a, n) => `<span style="display:block">${n+1}. ${a.label}</span>`).join("");

    const a = document.createElement("a");
    a.className = "route-pack";
    a.href = url;
    a.target = "_blank";
    a.innerHTML = `<span class="route-pack-label">Пак ${idx+1} · ${chunk.length} точек · ${rangeLabel}</span>${addrList}`;
    routeLinksEl.appendChild(a);
  });
}

function clearAll() {
  const confirmed = confirm("Очистить список?");
  if (!confirmed) return;
  data = [];
  localStorage.removeItem("data");
  render();
}

render();

document.addEventListener("click", function(e) {
  const search = document.getElementById("search");
  const list = document.getElementById("streetList");
  if (e.target !== search) list.innerHTML = "";
});
</script>
</body>
</html>
